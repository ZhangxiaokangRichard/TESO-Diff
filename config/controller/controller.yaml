# Python 张量并行控制器参数（docs/TESO-Diff_phase2.md §6.11/§6.12）
#
# 结构：外环（L1 + TECS + 协调转弯）+ 内环（PID 姿态）。
# 控制器不编译 .so，纯 Python 张量实现，可对 B 个实例一次解算。
# 参数在 WP2A-8 闭环调试中整定；此处为占位初值。

controller:
  name: tecs_l1_pid_v01
  outer_rate_hz: 20        # 外环更新频率（TECS/L1/协调转弯）
  inner_rate_hz: 50        # 内环更新频率，与 plant 同频
  batch_compatible: true   # 全张量化，无逐实例 Python 循环

outer:
  l1:
    period_s: 10.0         # L1 参考距离对应时间，WP2A-8 整定
    damping: 0.75
    a_cmd_limit_mps2: 15.0
  tecs:
    total_energy_kp: 0.2   # 总能量误差 → 油门（占位）
    total_energy_ki: 0.05
    balance_kp: 0.3        # 能量分配误差 → 俯仰（占位）
    throttle_limits: [0.0, 1.0]
    gamma_cmd_limit_deg: [-15.0, 15.0]
  coordinated_turn:
    bank_limit_deg: 30.0
    bank_rate_limit_degps: 15.0

inner:
  roll:
    kp: 0.8
    ki: 0.1
    kd: 0.02
    output_limits: [-1.0, 1.0]    # delta_a 归一化
  pitch:
    kp: 0.8
    ki: 0.1
    kd: 0.02
    output_limits: [-1.0, 1.0]    # delta_e 归一化
  yaw:
    kp: 0.5
    ki: 0.02
    kd: 0.0
    output_limits: [-1.0, 1.0]    # delta_r 归一化

# 长期 TESO action 目标（docs §6.11）：
#   a = [V_a*, gamma*, turn_rate*, gamma_rate*, cT, Tq]
teso_action:
  airspeed_mps: "V_a*"
  gamma_rad: "gamma*"
  turn_rate_radps: "turn_rate*"
  gamma_rate_radps: "gamma_rate*"
  throttle: "cT"
  duration_s: "Tq"
