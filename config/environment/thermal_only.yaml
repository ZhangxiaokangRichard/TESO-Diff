# W1 仅上升气流环境（docs §16.2）
# 热气流/上升带（中心、半径、峰值 Wz、形状、漂移），无水平剪切。

wind:
  matrix_class: W1
  type: thermal
  radius_m: [30.0, 120.0]
  peak_vertical_mps: [0.5, 5.0]
  shape: gaussian           # gaussian | wharington | core_edge
  vertical_extent_m: [50.0, 500.0]
  drift_mps: [0.0, 0.0]     # 静态热气流的中心漂移（动态见 D3）
  disturbance:
    background_wind_mps: [0.0, 6.0]
    turbulence: off
    gust: off
